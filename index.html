<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Интерактивные уроки информатики</title>
  <script>
  // Есть действующая сессия (токен + ученик) — к урокам, иначе ко входу.
  (function () {
    var token = null;
    var student = null;
    try {
      token = localStorage.getItem('accountToken');
      student = localStorage.getItem('student');
    } catch (e) {
      token = null;
      student = null;
    }
    window.location.href = (token && student) ? 'lessons.html' : 'login.html';
  })();
</script>
</head>
<body>
<p>Загрузка...</p>
</body>
</html>
