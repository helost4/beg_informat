<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Интерактивные уроки информатики</title>
  <script>
  // Есть действующая сессия — на главную страницу роли, иначе ко входу.
  (function () {
    var token = null;
    var student = null;
    try {
      token = localStorage.getItem('accountToken');
      student = localStorage.getItem('student');
    } catch (e) {
      token = null;
      student = null;
    }
    if (!token || !student) {
      window.location.href = 'login.html';
      return;
    }

    var session = null;
    try { session = JSON.parse(student); } catch (e) { session = null; }
    var role = (session && session.role) || 'student';
    var target;
    switch (role) {
      case 'teacher': target = 'teacher.html'; break;
      case 'parent':  target = 'parent.html';  break;
      case 'admin':   target = 'admin.html';   break;
      default:        target = 'lessons.html';
    }
    window.location.href = target;
  })();
</script>
</head>
<body>
<p>Загрузка...</p>
</body>
</html>
