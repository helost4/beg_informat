<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кабинет родителя · Интерактивные уроки информатики</title>
<link rel="stylesheet" href="shared/style.css">
<link rel="stylesheet" href="shared/dashboard.css">
</head>
<body>
<div class="dash-wrap">
  <div class="dash-header">
    <div>
      <h1>👨‍👩‍👧 Кабинет родителя</h1>
      <p class="dash-sub" id="dashSub">Успеваемость вашего ребёнка</p>
    </div>
    <div class="dash-actions">
      <a class="dash-btn ghost" href="lessons.html">📚 Уроки</a>
      <button class="dash-btn danger" id="logoutBtn" type="button">🚪 Выйти</button>
    </div>
  </div>

  <div class="stat-grid" id="statGrid"></div>
  <div class="dash-status" id="status">Загрузка данных…</div>

  <div id="childrenList"></div>

  <div class="dash-card">
    <h2>📝 Последние работы</h2>
    <div class="table-scroll">
      <table class="dash-table" id="resultsTable" hidden>
        <thead>
          <tr><th>Дата</th><th>Ученик</th><th>Работа</th><th>Баллы</th><th>Оценка</th></tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </div>
    <div class="dash-muted" id="resultsEmpty" hidden>Работ пока нет.</div>
  </div>
</div>

<script src="shared/account.js"></script>
<script>
(function () {
  'use strict';

  if (!Account.requireRole(['parent', 'admin'], 'login.html')) return;

  var student = Account.currentStudent();
  var statusEl = document.getElementById('status');
  var students = [];
  var results = [];

  document.getElementById('dashSub').textContent =
    '👤 ' + student.name + ' · ' + Account.roleLabel(student.role);

  document.getElementById('logoutBtn').onclick = function () {
    Account.logout();
    window.location.href = 'login.html';
  };

  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function pctClass(pct) {
    return pct >= 75 ? 'pct-good' : (pct >= 50 ? 'pct-mid' : 'pct-low');
  }

  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.className = 'dash-status' + (kind ? ' ' + kind : '');
    statusEl.hidden = !text;
  }

  function renderStats() {
    var totalPct = 0;
    students.forEach(function (s) { totalPct += s.avgPct || 0; });

    var items = [
      { value: students.length, label: 'Детей', cls: 'blue' },
      { value: results.length, label: 'Работ', cls: 'purple' },
      { value: (students.length ? Math.round(totalPct / students.length) : 0) + '%', label: 'Средний балл', cls: 'green' }
    ];

    document.getElementById('statGrid').innerHTML = items.map(function (i) {
      return '<div class="stat ' + i.cls + '"><div class="stat-value">' + esc(i.value) +
        '</div><div class="stat-label">' + esc(i.label) + '</div></div>';
    }).join('');
  }

  function renderChildren() {
    var box = document.getElementById('childrenList');

    if (!students.length) {
      box.innerHTML = '<div class="dash-card"><div class="empty-state">' +
        '<span class="empty-emoji">📭</span>' +
        '<div>Данные пока не появились. Если ребёнок уже занимался, обратитесь к администратору: ' +
        'нужно привязать его аккаунт к вашему.</div></div></div>';
      return;
    }

    box.innerHTML = students.map(function (s) {
      var pct = s.avgPct || 0;
      var lessons = (s.lessons || []).map(function (l) {
        return '<li><span>' + esc(l.lesson) + '</span><span class="' + pctClass(l.pct) + '">' +
          esc(l.score + ' / ' + l.maxScore + ' · ' + l.pct + '%') + '</span></li>';
      }).join('');

      return '<div class="dash-card child-card">' +
        '<div class="child-head">' +
          '<div><div class="child-name">👤 ' + esc(s.name) + '</div>' +
            '<div class="dash-muted">' + esc(s.className) + ' · работ: ' + esc(s.resultsCount) + '</div></div>' +
          '<div><span class="' + pctClass(pct) + '" style="font-size:1.4rem;font-weight:800;">' + pct + '%</span>' +
            '<div class="pct-bar" style="min-width:140px;"><span style="width:' + pct + '%"></span></div></div>' +
        '</div>' +
        (lessons ? '<h3>Результаты по темам</h3><ul class="lesson-list-mini">' + lessons + '</ul>' :
          '<p class="dash-muted">Результатов по темам пока нет.</p>') +
        '<div class="dash-muted" style="margin-top:12px;">Последняя активность: ' +
          esc(Account.formatDate(s.lastActive)) + '</div>' +
        '</div>';
    }).join('');
  }

  function renderResults() {
    var list = results.slice(0, 60);
    var table = document.getElementById('resultsTable');
    var empty = document.getElementById('resultsEmpty');

    if (!list.length) {
      table.hidden = true;
      empty.hidden = false;
      return;
    }

    empty.hidden = true;
    table.hidden = false;
    document.getElementById('resultsBody').innerHTML = list.map(function (r) {
      return '<tr>' +
        '<td><small>' + esc(Account.formatDate(r.timestamp)) + '</small></td>' +
        '<td>' + esc(r.studentName) + '</td>' +
        '<td>' + esc(r.lesson) + '<small>' + esc(Account.workTypeLabel(r.workType) +
          (r.variant ? ' · ' + r.variant : '')) + '</small></td>' +
        '<td>' + esc(r.score + ' / ' + r.maxScore) + '</td>' +
        '<td>' + esc(r.grade) + '</td>' +
        '</tr>';
    }).join('');
  }

  Account.viewResults().then(function (data) {
    students = data.students || [];
    results = data.results || [];
    renderStats();
    renderChildren();
    renderResults();
    setStatus('Загружено детей: ' + students.length + ', работ: ' + results.length + '.', 'ok');
    setTimeout(function () { setStatus(''); }, 4000);
  }).catch(function (err) {
    setStatus('Не удалось загрузить данные: ' + (err && err.message ? err.message : err), 'error');
    if (err && (err.code === 'AUTH_REQUIRED' || err.code === 'TOKEN_EXPIRED')) {
      Account.logout();
      setTimeout(function () { window.location.href = 'login.html'; }, 1500);
    }
  });
})();
</script>
</body>
</html>
