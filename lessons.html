<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои уроки · Информатика</title>
<link rel="stylesheet" href="shared/style.css">
<style>
  .lessons-wrap{max-width:900px;margin:40px auto;padding:0 20px;}
  .lessons-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:24px;}
  .lessons-header h1{margin:0;font-size:1.6rem;background:linear-gradient(90deg,#3b82f6,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .student-badge{background:#eff6ff;border:2px solid #3b82f6;border-radius:12px;padding:10px 16px;font-weight:600;color:#1e293b;}
  .lesson-card{display:block;background:#fff;border-radius:14px;padding:16px 20px;margin-bottom:12px;
    text-decoration:none;color:#1e293b;border-left:4px solid #3b82f6;box-shadow:0 4px 12px rgba(0,0,0,.06);transition:.2s;}
  .lesson-card:hover{transform:translateX(4px);box-shadow:0 8px 20px rgba(59,130,246,.2);border-left-color:#ec4899;}
  .lesson-card .tag{font-size:.8rem;color:#64748b;display:block;margin-top:4px;}
  .logout-btn{background:#fff;border:2px solid #ef4444;color:#ef4444;border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:600;}
  .logout-btn:hover{background:#fef2f2;}
  .no-lessons{background:#fffbeb;border:2px solid #f59e0b;border-radius:12px;padding:20px;color:#92400e;}
  .lessons-section{margin-bottom:30px;}
  .lessons-section .section-title{font-size:1.15rem;margin:0 0 12px;color:#1e293b;display:flex;align-items:center;gap:8px;}
  .section-empty{background:#f8fafc;border:2px dashed #cbd5e1;border-radius:12px;padding:14px 18px;color:#64748b;font-size:.92rem;line-height:1.45;}
</style>
</head>
<body>
<div class="lessons-wrap">
  <div class="lessons-header">
    <h1>📚 Мои уроки</h1>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      <div class="student-badge" id="studentBadge"></div>
      <button class="logout-btn" id="logoutBtn">Выйти</button>
    </div>
  </div>

  <div id="lessonsList"></div>

  <section class="results-block" id="resultsBlock">
    <div class="results-head">
      <h2>📊 Мои результаты</h2>
      <button class="results-refresh" id="refreshResultsBtn" type="button">Обновить</button>
    </div>
    <div class="results-status" id="resultsStatus">Загрузка результатов…</div>
    <div id="resultsList"></div>
  </section>
</div>

<script src="shared/account.js"></script>
<script>
(function () {
  'use strict';

  /* ---------- Проверка входа ---------- */
  if (!Account.requireLogin('login.html')) return;

  const student = Account.currentStudent();
  if (!student) {
    window.location.href = 'login.html';
    return;
  }

  document.getElementById('studentBadge').textContent =
    `👤 ${student.name} · ${student.class}`;

  /* ---------- Выход ---------- */
  document.getElementById('logoutBtn').addEventListener('click', function () {
    Account.logout();
    window.location.href = 'login.html';
  });

  /* ---------- Справочник всех уроков по классам ---------- */
  const LESSONS_CATALOG = {
    "5 класс": [
      { file: "5-class/lesson-08-tekst.html", title: "Текст как форма представления информации", tag: "§ 8" },
      { file: "5-class/lesson-07-kodirovanie.html", title: "Кодирование информации", tag: "§ 7" }
    ],
    "6 класс": [
      { file: "6-class/lesson-05-sistema.html", title: "Система и окружающая среда. Система как «чёрный ящик»", tag: "§ 5" },
      { file: "6-class/lesson-06-ponyatie.html", title: "Понятие как форма мышления", tag: "§ 8" }
    ],
    "7 класс": [],
    "8 класс": [],
    "9 класс": [],
    "10 класс": [
      { file: "10-class/lesson-10-networks.html", title: "Сеть. IP-адреса. Маски", tag: "ЕГЭ №10" }
    ],
    "11 класс": []
  };

  /* Уроки, доступные всем классам (5–11) */
  const PYTHON_CATALOG = [
    { file: "python-class/lesson-01-start.html", title: "Python для начинающих. Урок 1. Первая программа в IDLE (Astra Linux)", tag: "5–11 классы · Astra Linux · IDLE" }
  ];

  const CATALOG_EGE = {
    "9 класс": [
      { file: "ege-class/lesson-10-networks.html", title: "Тренажер: Сети. IP-адреса. Маски", tag: "ЕГЭ №10" }
    ],
    "10 класс": [
      { file: "ege-class/lesson-10-networks.html", title: "Тренажер: Сети. IP-адреса. Маски", tag: "ЕГЭ №10" }
    ],
    "11 класс": [
      { file: "ege-class/lesson-10-networks.html", title: "Тренажер: Сети. IP-адреса. Маски", tag: "ЕГЭ №10" }
    ]
  };

  /* ---------- Рендер уроков: обычные и тренажёры ЕГЭ ---------- */
  const container = document.getElementById('lessonsList');
  const SENIOR_CLASSES = ['9 класс', '10 класс', '11 класс'];
  const isSenior = SENIOR_CLASSES.indexOf(student.class) !== -1;

  function renderSection(title, items, emptyText) {
    const section = document.createElement('section');
    section.className = 'lessons-section';

    const heading = document.createElement('h2');
    heading.className = 'section-title';
    heading.textContent = title;
    section.appendChild(heading);

    if (!items || !items.length) {
      const empty = document.createElement('div');
      empty.className = 'section-empty';
      empty.textContent = emptyText;
      section.appendChild(empty);
    } else {
      const listEl = document.createElement('div');
      listEl.className = 'lesson-list';

      items.forEach(function (lesson) {
        const a = document.createElement('a');
        a.className = 'lesson-card';
        a.href = lesson.file;
        a.innerHTML = `${lesson.title}<span class="tag">${lesson.tag}</span>`;
        listEl.appendChild(a);
      });

      section.appendChild(listEl);
    }

    container.appendChild(section);
  }

  renderSection('🐍 Python для начинающих', PYTHON_CATALOG, '');

  if (isSenior) {
    renderSection(
      '📘 Обычные уроки',
      LESSONS_CATALOG[student.class],
      `Обычных уроков для ${student.class} пока нет. Доступен тренажёр ЕГЭ.`
    );
    renderSection(
      '🎯 Тренажёры ЕГЭ',
      CATALOG_EGE[student.class],
      `Тренажёров для ${student.class} пока нет.`
    );
  } else {
    renderSection(
      '📘 Уроки',
      LESSONS_CATALOG[student.class],
      `Для ${student.class} пока нет уроков. Обратитесь к учителю.`
    );
  }

  /* ---------- Мои результаты ---------- */
  const refreshBtn = document.getElementById('refreshResultsBtn');
  const statusEl = document.getElementById('resultsStatus');
  const resultsList = document.getElementById('resultsList');

  function renderResults(rows) {
    resultsList.textContent = '';
    statusEl.style.color = '#64748b';

    if (!rows || !rows.length) {
      statusEl.textContent = 'Пока результатов нет. Пройдите урок или тренажёр — результаты появятся здесь.';
      const empty = document.createElement('div');
      empty.className = 'results-empty';
      empty.textContent = 'Сохранённых работ пока нет.';
      resultsList.appendChild(empty);
      return;
    }

    statusEl.textContent = 'Всего результатов: ' + rows.length +
      ' · показаны последние ' + Math.min(rows.length, 100);

    const scroll = document.createElement('div');
    scroll.className = 'results-scroll';

    const table = document.createElement('table');
    table.className = 'results-table';

    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    ['Дата', 'Работа', 'Баллы', '%', 'Оценка'].forEach(function (text) {
      const th = document.createElement('th');
      th.textContent = text;
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');

    rows.slice(0, 100).forEach(function (row) {
      const pct = Account.percent(row.score, row.maxScore);
      const grade = Number(row.grade) || Account.gradeFor(pct);

      const tr = document.createElement('tr');

      const dateTd = document.createElement('td');
      dateTd.textContent = Account.formatDate(row.timestamp);
      dateTd.className = 'num';
      tr.appendChild(dateTd);

      const workTd = document.createElement('td');
      const work = document.createElement('div');
      work.className = 'work';
      work.textContent = row.lesson || 'Работа';
      const variant = document.createElement('div');
      variant.className = 'variant';
      const typeLabel = Account.workTypeLabel(row.workType);
      variant.textContent = typeLabel + (row.variant ? ' · ' + row.variant : '');
      workTd.appendChild(work);
      workTd.appendChild(variant);
      tr.appendChild(workTd);

      const scoreTd = document.createElement('td');
      scoreTd.className = 'num';
      scoreTd.textContent = (Number(row.score) || 0) + ' / ' + (Number(row.maxScore) || 0);
      tr.appendChild(scoreTd);

      const pctTd = document.createElement('td');
      pctTd.className = 'num';
      pctTd.textContent = pct + '%';
      tr.appendChild(pctTd);

      const gradeTd = document.createElement('td');
      const pill = document.createElement('span');
      pill.className = 'grade-pill g' + grade;
      pill.textContent = grade;
      gradeTd.appendChild(pill);
      tr.appendChild(gradeTd);

      tbody.appendChild(tr);
    });

    table.appendChild(tbody);
    scroll.appendChild(table);
    resultsList.appendChild(scroll);
  }

  function loadResults() {
    refreshBtn.disabled = true;
    statusEl.style.color = '#64748b';
    statusEl.textContent = 'Загрузка результатов…';
    resultsList.textContent = '';

    // Сначала досылаем то, что не ушло в прошлый раз, потом читаем историю.
    Account.flushQueue()
      .catch(function () { return 0; })
      .then(function () { return Account.getMyResults(); })
      .then(function (rows) {
        refreshBtn.disabled = false;
        renderResults(rows);
      })
      .catch(function (err) {
        refreshBtn.disabled = false;

        if (err && (err.code === 'AUTH_REQUIRED' || err.code === 'TOKEN_EXPIRED')) {
          Account.logout();
          window.location.href = 'login.html';
          return;
        }

        statusEl.style.color = '#b91c1c';
        statusEl.textContent = 'Не удалось загрузить результаты. ' +
          ((err && err.message) || 'Проверьте интернет и попробуйте ещё раз.');
      });
  }

  refreshBtn.addEventListener('click', loadResults);
  loadResults();
})();
</script>
</body>
</html>
